name: Live Board and Audiobook smoke test

on:
  push:
    branches: ["fix/story-character-references"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-audio-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-models:
    name: Real Qwen3 4B and neural narration
    runs-on: macos-14
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.smoke-hf
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check Apple Silicon runner
        run: python -c "import platform,sys; assert sys.platform == 'darwin' and platform.machine() == 'arm64', 'Live inference requires Apple Silicon'"
      - name: Install the app's pinned engine runtime
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --no-deps --only-binary=:all: -r engine/requirements.lock
      - name: Real model pipeline test
        run: python scripts/smoke_story_audio.py --output smoke-results
      - name: Upload fixture audio and diagnostic results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-story-audio-${{ github.run_id }}
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 7
